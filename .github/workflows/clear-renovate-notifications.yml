name: Clear Renovate notifications

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log matching notifications without marking them done"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clear-renovate-notifications

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark auto-merged Renovate PR notifications as done
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.NOTIFICATION_TOKEN }}
          script: |
            const clear = require("./.github/scripts/clear-renovate-notifications.js");
            await clear({ github, core, dryRun: process.env.DRY_RUN === "true" });
